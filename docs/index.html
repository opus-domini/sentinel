<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sentinel — Local-first Host Operations</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="description"
      content="Documentation for Sentinel, a local-first operational workspace that connects current host signals to verified action."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css"
    />
    <style>
      .mermaid {
        display: flex;
        justify-content: center;
        overflow-x: auto;
      }

      .mermaid svg {
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.mermaidReady = import(
        "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs"
      ).then(({ default: mermaid }) => {
        mermaid.initialize({ startOnLoad: false, theme: "dark" });
        return mermaid;
      });

      window.$docsify = {
        name: "Sentinel",
        repo: "https://github.com/opus-domini/sentinel",
        homepage: "README.md",
        loadSidebar: true,
        subMaxLevel: 2,
        auto2top: true,
        relativePath: false,
        search: {
          maxAge: 86400000,
          paths: "auto",
          depth: 3,
          placeholder: "Search docs",
          noData: "No results found",
        },
        copyCode: {
          buttonText: "Copy",
          errorText: "Error",
          successText: "Copied",
        },
        plugins: [
          function renderMermaid(hook) {
            let renderGeneration = 0;
            hook.doneEach(function () {
              const generation = ++renderGeneration;
              const diagrams = [];
              window.mermaidReady
                .then((mermaid) => {
                  if (generation !== renderGeneration) return;
                  document.querySelectorAll('pre[data-lang="mermaid"]').forEach((block) => {
                    const source = block.querySelector("code");
                    if (!source) return;

                    const diagram = document.createElement("pre");
                    diagram.className = "mermaid";
                    diagram.textContent = source.textContent;
                    block.replaceWith(diagram);
                    diagrams.push(diagram);
                  });
                  if (
                    generation === renderGeneration &&
                    diagrams.some((diagram) => diagram.isConnected)
                  ) {
                    return mermaid.run({ nodes: diagrams });
                  }
                })
                .catch((error) => {
                  const renderWasCancelled =
                    generation !== renderGeneration ||
                    diagrams.every((diagram) => !diagram.isConnected);
                  if (!renderWasCancelled) {
                    console.error("failed to render Mermaid", error);
                  }
                });
            });
          },
        ],
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-go-module.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  </body>
</html>
