[tools]
go = "1.27.0"
# Keep npm before node so the pinned npm shim wins over Node's bundled npm.
"npm:npm" = "12.0.2"
node = "26"

# Keep in sync with .github/workflows/ci.yml
golangci-lint = "2.13.1"                          # GOLANGCI_LINT_VERSION
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"  # GOVULNCHECK_VERSION
